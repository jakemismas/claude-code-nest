<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!--
  Screenshot harness for the org panel.

  This page hosts the real panel assets (../../media/orgPanel.css and
  ../../media/orgPanel.js) exactly as the extension ships them, so a screenshot shows
  what the panel actually renders. It stands in for the VS Code webview host by:

    1. defining acquireVsCodeApi() before orgPanel.js runs (the script calls it at load;
       without the stub it throws and nothing renders);
    2. reproducing the static DOM skeleton that orgPanelWebview.renderHtml emits (the
       New session pill, the gear, the sort button and popover, the search box, the
       #chips rail and the #list tree) so the script's getElementById wiring finds every
       node it expects. Keep this shell in step with renderHtml; if it drifts, the panel
       renders nothing here;
    3. posting made-up 'state' then 'sections' messages in the same shape the host posts
       (see OrgSections and OrgChatRow in src/views/orgPanelModel.ts).

  All data here is made up. No real transcript content is embedded.

  The mock includes starred rows, per-row status ('question' shows a blinking '?' badge,
  'done' a solid unread dot), a folder breadcrumb on the Questions rows, an active row,
  colored folders and tag chips, and archived chats, so one run shows every state the
  panel draws.

  Only the 320px width and the panel background are pinned, so the screenshot frames the
  panel like a 320px sidebar. The Newsreader @font-face in orgPanel.css resolves its
  relative fonts/ url against ../../media/, so the harness loads the same bundled font
  the extension ships.
-->
<style id="harness-frame">
  html, body {
    margin: 0;
    padding: 0;
    background: #FCFBF8;
  }
  body {
    width: 320px;
  }
</style>
<!--
  Dark theme is opt-in via ?theme=dark (set by screenshot.js --theme dark). Light adds
  nothing. The values mirror a typical dark editor theme so surfaces that follow
  --vscode-* render dark.
-->
<style id="harness-dark">
  html[data-theme="dark"], html[data-theme="dark"] body {
    background: #252526;
    color: #cccccc;
    --vscode-foreground: #cccccc;
    --vscode-descriptionForeground: #9d9d9d;
    --vscode-icon-foreground: #c5c5c5;
    --vscode-sideBar-background: #252526;
    --vscode-sideBar-foreground: #cccccc;
    --vscode-editorWidget-background: #202020;
    --vscode-input-background: #3c3c3c;
    --vscode-input-border: #3c3c3c;
    --vscode-panel-border: #2b2b2b;
    --vscode-list-hoverBackground: #2a2d2e;
    --vscode-list-activeSelectionBackground: #04395e;
    --vscode-list-dropBackground: #383b3d;
    --vscode-toolbar-hoverBackground: rgba(90, 93, 94, 0.31);
  }
</style>
<script>
  (function () {
    if (/[?&]theme=dark(&|$)/.test(location.search)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
<link href="../../media/orgPanel.css" rel="stylesheet" />
</head>
<body>
  <!--

    changes, this must change with it.
  -->
  <header class="nest-header"><span id="robinSlot" class="nest-robin-slot" aria-hidden="true"></span><span class="nest-wordmark">Nest</span><span id="robinLive" class="nest-sr-only" role="status" aria-live="polite"></span></header>
  <div class="nest-toolbar">

  <!--
    The acquireVsCodeApi stub MUST be defined before orgPanel.js loads: the script
    calls acquireVsCodeApi() at module scope, so an undefined global throws before a
    single row renders. postMessage/setState/getState are captured (not needed for a
    static screenshot) so any outbound message from the script is a harmless no-op.
  -->
  <script>
    (function () {
      const outbound = [];
      // The host content-search reply the harness stands in for. When the panel
      // posts { type:'search', query } (the debounced content-search request), the real extension host answers with { type:'searchResults' } ranked
      // rows carrying a role-prefixed body-match snippet. The harness must reply too,
      // or the flat "N RESULTS" state renders 0 results and the results-state
      // capture is blank. The reply is synthetic and
      // deterministic: for a non-empty query it returns the 'Rate limiter design'
      // chat (s-11, filed under Work / Backend API, so it shows a breadcrumb) with a
      // "You: ..." body-match snippet.
      // An empty query returns no rows (mirrors the host short-circuit).
      window.__nestHarnessSearchReply = function (query) {
        const q = (query || '').trim();
        if (q.length === 0) {
          return { type: 'searchResults', query: query, rows: [] };
        }
        return {
          type: 'searchResults',
          query: query,
          rows: [
            {
              rank: 0,
              sessionId: 's-11',
              title: 'Rate limiter design',
              description: '3h',
              timestamp: Date.now() - 3 * 60 * 60 * 1000,
              tokens: '~20k tok',
              snippet: 'You: ...a token-bucket rate limiter backed by Redis for the public API...',
            },
          ],
        };
      };
      // The host reply for an openArchive request.
      // When the panel opens the Archive overlay it posts { type:'openArchive' }; the real
      // extension host answers with { type:'archivedRows', rows } built by buildArchivedRows
      // from the synced userArchived membership. The harness must reply too, or the overlay
      // renders an empty "Nothing archived." state and the archive capture is
      // blank. The rows are synthetic and deterministic: two present archived chats (one
      // filed, one unsorted) plus one cleaned-up (gone) chat. All titles are invented.
      window.__nestHarnessArchivedRows = function () {
        return {
          type: 'archivedRows',
          rows: [
            {
              sessionId: 'arch-1',
              title: 'Resume rewrite',
              folder: 'Personal',
              relativeTime: '1w',
              starred: false,
              present: true,
            },
            {
              sessionId: 'arch-2',
              title: 'Onboarding flow copy',
              folder: 'Unsorted',
              relativeTime: '2mo',
              starred: false,
              present: true,
            },
            {
              sessionId: 'arch-gone',
              title: 'Old spike notes',
              folder: 'Unsorted',
              relativeTime: '',
              starred: false,
              present: false,
            },
          ],
        };
      };
      window.acquireVsCodeApi = function () {
        return {
          postMessage: function (m) {
            outbound.push(m);
            // Echo a synthetic host reply for a content-search request so the
            // results view populates exactly as it would against the real host.
            if (m && m.type === 'search') {
              const reply = window.__nestHarnessSearchReply(m.query);
              window.postMessage(reply, '*');
            }
            // Echo the synthetic archived-rows reply for an openArchive request so the
            // Archive overlay populates exactly as it would against the real host.
            if (m && m.type === 'openArchive') {
              window.postMessage(window.__nestHarnessArchivedRows(), '*');
            }
            // The host answers the Active button by posting the recomputed fleet sections.
            if (m && m.type === 'setActive' && window.__nestHarnessFleet) {
              window.postMessage(window.__nestHarnessFleet(m.active), '*');
            }
          },
          setState: function () {},
          getState: function () { return undefined; },
        };
      };
      // Exposed only so the screenshot driver can confirm the script initialised
      // (it posts { type: 'ready' } on load); not part of the rendered surface.
      window.__nestHarnessOutbound = outbound;
    })();
  </script>

  <!-- The real, shipped panel script. Renders the mock posted below. -->
  <script src="../../media/orgPanel.js"></script>

  <!--
    Synthetic mock data, posted in the exact host message shape. Timestamps are
    computed relative to load time so the panel's relative() helper produces the
    the age buckets (35m / 3h / 1d / 2w) deterministically at capture.
  -->
  <script>
    (function () {
      const MIN = 60 * 1000;
      const HOUR = 60 * MIN;
      const DAY = 24 * HOUR;
      const now = Date.now();

      // Palette for the colored folders and tag chips.
      const TAG = {
        bug: '#B14F36',
        feature: '#9A6B1E',
        refactor: '#5E7148',
        research: '#4F6582',
        docs: '#3F7572',
        idea: '#7B5C82',
      };
      const FOLDER = {
        release: '#d97757',
        api: '#4F6582',
        ideasColor: '#7B5C82',
        defaultColor: '#C2A56E',
      };

      // Reusable synthetic rows. Each matches the OrgChatRow shape exactly:
      // { sessionId, title, timestamp, tokens, snippet, tags, tagIds, tagColors,
      //   starred, awaitingReply, status, breadcrumb }. tagColors is parallel to tags.
      // status is the per-row status slot: 'question' ->
      // blinking '?' badge, 'done' -> solid unread dot, 'none' -> empty slot.
      // awaitingReply mirrors (status === 'question'). breadcrumb is the folder path
      // rendered on Questions/search rows (null otherwise). tokens rides the seam for
      // the search row / hover card but is NOT drawn on the visible row.
      function row(o) {
        return {
          sessionId: o.sessionId,
          title: o.title,
          timestamp: o.timestamp,
          tokens: o.tokens || '',
          snippet: o.snippet || null,
          tags: o.tags || [],
          tagIds: o.tagIds || [],
          tagColors: o.tagColors || [],
          starred: !!o.starred,
          awaitingReply: o.status === 'question',
          status: o.status || 'none',
          breadcrumb: o.breadcrumb || null,
        };
      }

      // The ACTIVE + starred chat: an UNREAD non-question assistant reply -> solid
      // 'done' dot.
      const rStarredDone = row({
        sessionId: 's-01',
        title: 'Refactor auth middleware',
        timestamp: now - 35 * MIN,
        tokens: '~48k tok',
        tags: ['refactor', 'bug'],
        tagIds: ['t-refactor', 't-bug'],
        tagColors: [TAG.refactor, TAG.bug],
        starred: true,
        status: 'done',
      });
      const rStarredIdea = row({
        sessionId: 's-10',
        title: 'Trip itinerary — Japan',
        timestamp: now - 1 * HOUR,
        tokens: '~9k tok',
        tags: ['idea'],
        tagIds: ['t-idea'],
        tagColors: [TAG.idea],
        starred: true,
        status: 'none',
      });
      const rQuestionDocs = row({
        sessionId: 's-02',
        title: 'Webhook retry strategy',
        timestamp: now - 15 * MIN,
        tokens: '~12k tok',
        tags: ['docs'],
        tagIds: ['t-docs'],
        tagColors: [TAG.docs],
        status: 'question',
      });
      // A Questions row that is FILED, so it carries a folder-path breadcrumb.
      const rQuestionFeature = row({
        sessionId: 's-11',
        title: 'Rate limiter design',
        timestamp: now - 3 * HOUR,
        tokens: '~20k tok',
        tags: ['feature'],
        tagIds: ['t-feature'],
        tagColors: [TAG.feature],
        status: 'question',
        breadcrumb: 'Work / Backend API',
      });
      const rApiChild = row({
        sessionId: 's-05',
        title: 'Fix N+1 query in orders',
        timestamp: now - 1 * DAY,
        tokens: '~22k tok',
        tags: ['bug'],
        tagIds: ['t-bug'],
        tagColors: [TAG.bug],
        status: 'none',
      });
      const rUnsorted1 = row({
        sessionId: 's-08',
        title: 'Webhook retry strategy',
        timestamp: now - 15 * MIN,
        tokens: '~2k tok',
        tags: ['docs'],
        tagIds: ['t-docs'],
        tagColors: [TAG.docs],
        status: 'question',
      });
      const rUnsorted2 = row({
        sessionId: 's-09',
        title: 'CSS grid cheatsheet',
        timestamp: now - 2 * DAY,
        tokens: '~3k tok',
        tags: ['docs', 'idea'],
        tagIds: ['t-docs', 't-idea'],
        tagColors: [TAG.docs, TAG.idea],
        status: 'none',
      });

      // The full section model, in the exact OrgSections shape. Covers Starred,
      // Questions (heuristic), a nested folder hierarchy with per-folder color
      // (Work with a Backend API child folder, Personal, Experiments), the
      // always-present synthetic Unsorted bucket, the tag filter chips with counts,
      // and archivedCount so the bottom Archived row renders. Each folder carries
      // depth (clamped render depth), treeDepth (true stored depth, used by the
      // collapse/hide skip), and rolledUpCount (its own chats + all descendants).
      // f-legacy is a depth-2 grandchild under Backend API to
      // exercise the render clamp: its treeDepth is 2 and it renders
      // at the depth-2 (47px) tier, the deepest the UI shows.
      const sections = {
        starred: [rStarredDone, rStarredIdea],
        questions: [rQuestionDocs, rQuestionFeature],
        folders: [
          {
            folderId: 'f-work',
            name: 'Work',
            color: FOLDER.defaultColor,
            depth: 0,
            treeDepth: 0,
            synthetic: false,
            rolledUpCount: 4,
            rows: [],
          },
          {
            folderId: 'f-api',
            name: 'Backend API',
            color: FOLDER.defaultColor,
            depth: 1,
            treeDepth: 1,
            synthetic: false,
            rolledUpCount: 4,
            rows: [rStarredDone, rQuestionFeature, rApiChild],
          },
          {
            folderId: 'f-legacy',
            name: 'Legacy v1 (deep)',
            color: FOLDER.ideasColor,
            depth: 2,
            treeDepth: 2,
            synthetic: false,
            rolledUpCount: 1,
            rows: [rUnsorted2],
          },
          {
            folderId: 'f-frontend',
            name: 'Frontend',
            color: FOLDER.defaultColor,
            depth: 1,
            treeDepth: 1,
            synthetic: false,
            rolledUpCount: 0,
            rows: [],
          },
          {
            folderId: 'f-personal',
            name: 'Personal',
            color: FOLDER.defaultColor,
            depth: 0,
            treeDepth: 0,
            synthetic: false,
            rolledUpCount: 1,
            rows: [rStarredIdea],
          },
          {
            folderId: 'f-experiments',
            name: 'Experiments',
            color: FOLDER.defaultColor,
            depth: 0,
            treeDepth: 0,
            synthetic: false,
            rolledUpCount: 0,
            rows: [],
          },
          {
            folderId: '__unfiled__',
            name: 'Unsorted',
            depth: 0,
            treeDepth: 0,
            synthetic: true,
            rolledUpCount: 2,
            rows: [rUnsorted1, rUnsorted2],
          },
        ],
        tags: [
          { tagId: 't-bug', label: 'bug', color: TAG.bug, count: 2 },
          { tagId: 't-feature', label: 'feature', color: TAG.feature, count: 2 },
          { tagId: 't-refactor', label: 'refactor', color: TAG.refactor, count: 1 },
          { tagId: 't-research', label: 'research', color: TAG.research, count: 1 },
          { tagId: 't-idea', label: 'idea', color: TAG.idea, count: 2 },
          { tagId: 't-docs', label: 'docs', color: TAG.docs, count: 3 },
        ],
        // allTags is the FULL project tag list the chat context menu lists: every tag with id/label/color/count, INCLUDING a zero-chat tag the chip
        // row (tags) omits. 't-migration' (count 0) exercises the "list a tag no chat
        // carries yet" case in the harness context-menu capture.
        allTags: [
          { tagId: 't-bug', label: 'bug', color: TAG.bug, count: 2 },
          { tagId: 't-docs', label: 'docs', color: TAG.docs, count: 3 },
          { tagId: 't-feature', label: 'feature', color: TAG.feature, count: 2 },
          { tagId: 't-idea', label: 'idea', color: TAG.idea, count: 2 },
          { tagId: 't-migration', label: 'migration', color: TAG.research, count: 0 },
          { tagId: 't-refactor', label: 'refactor', color: TAG.refactor, count: 1 },
          { tagId: 't-research', label: 'research', color: TAG.research, count: 1 },
        ],
        archivedCount: 2,
      };

      // Post state first (sort/collapsed), then the sections, then the active chat,
      // matching the host's onMessage('ready') order (postState, postSections,
      // postActive). s-01 is the currently-open chat, so its rows carry the .nest-active
      // tint.
      window.postMessage({ type: 'state', sort: 'newest', collapsedFolders: [] }, '*');
      // The Settings overlay state: a 30-day
      // auto-archive window and all four sections ON, the defaults. The overlay reads this on the settings-overlay capture page.
      window.postMessage(
        {
          type: 'settings',
          autoArchiveWindowDays: 30,
          sectionsVisible: { starred: true, questions: true, folders: true, unsorted: true },
        },
        '*',
      );
      // ?fleet=ticket or ?fleet=folder adds the fleet view: the host's 'fleet' message in
      // the ticket view or the any-folder view, with made-up data. The Starred and
      // Questions sections are empty there so the capture shows the fleet layout alone.
      const fleetView = (/[?&]fleet=(ticket|folder)(&|$)/.exec(location.search) || [])[1] || null;
      const fleetSections = Object.assign({}, sections, {
        starred: [],
        questions: [],
        folders: sections.folders.filter((f) => f.folderId === 'f-personal'),
        tags: [],
        allTags: [],
        archivedCount: 3,
      });
      window.postMessage({ type: 'sections', sections: fleetView ? fleetSections : sections }, '*');
      window.postMessage({ type: 'active', sessionId: 's-01' }, '*');

      const STATUS_LABELS = { working: 'Working', needs: 'Needs you', queued: 'Queued', done: 'Done', idle: 'Idle' };
      const isLive = (r) => r.status === 'working' || r.status === 'needs';

      // A chat row in the host's message shape. A child chat sits one level deeper.
      function fleetRow(o, level, pos, size) {
        const label = [o.tag, o.suffix || o.title].filter(Boolean).join(' ');
        return {
          sessionId: o.id,
          title: o.title || '',
          status: o.status,
          statusLabel: STATUS_LABELS[o.status],
          agentTag: o.tag || '',
          tagKind: o.tag || '',
          suffix: o.suffix || '',
          child: !!o.child,
          ariaLevel: o.child ? level + 1 : level,
          ariaPosInSet: pos,
          ariaSetSize: size,
          ariaLabel: (label || o.title) + '. ' + STATUS_LABELS[o.status] + '.',
        };
      }

      function fleetGroup(g, active, pos, size) {
        const chats = active ? g.rows.filter(isLive) : g.rows;
        const rows = chats.map((r, i) => fleetRow(r, 2, i + 1, chats.length));
        const rank = ['needs', 'working', 'queued', 'done', 'idle'];
        const rollup = chats.length === 0 ? null : chats.map((r) => r.status).sort((a, b) => rank.indexOf(a) - rank.indexOf(b))[0];
        const hasLive = g.rows.some(isLive);
        return {
          id: g.id,
          kind: g.kind,
          label: g.label,
          ticket: g.ticket || null,
          title: g.title || '',
          stage: g.stage || '',
          stageFamily: g.family || '',
          stageColor: null,
          rollup: rollup,
          hasLive: hasLive,
          forceOpen: active && hasLive,
          count: rows.length,
          ariaLevel: 1,
          ariaPosInSet: pos,
          ariaSetSize: size,
          ariaLabel: (g.ticket ? g.ticket + ' ' + g.title : g.label) + '. ' + rows.length + ' chats.',
          rows: rows,
        };
      }

      const TICKET_DATA = {
        orchestrator: { id: 'o-0001', title: 'Orchestrator', status: 'working' },
        past: [
          { id: 'o-0002', title: 'Orchestrator, earlier', status: 'done' },
          { id: 'o-0003', title: 'Orchestrator, before that', status: 'done' },
        ],
        groups: [
          { id: 'ticket.A-101', kind: 'ticket', label: 'A-101', ticket: 'A-101', title: 'Gateway response handling', stage: 'Back for UAT', family: 'teal', rows: [
            { id: 'c-101', tag: 'fix', suffix: 'round 2', status: 'done' },
            { id: 'c-102', tag: 'qa', suffix: 'round 2', status: 'working' },
          ] },
          { id: 'ticket.A-102', kind: 'ticket', label: 'A-102', ticket: 'A-102', title: 'Quote line rounding', stage: 'UAT failed', family: 'orange', rows: [
            { id: 'c-103', tag: 'fix', suffix: '', status: 'needs' },
          ] },
          { id: 'ticket.A-105', kind: 'ticket', label: 'A-105', ticket: 'A-105', title: 'Rebate tier rounding', stage: 'In build', family: 'blue', rows: [
            { id: 'c-104', tag: 'build', suffix: '', status: 'working' },
            { id: 'c-105', tag: 'spike', suffix: 'data check', status: 'working' },
          ] },
          { id: 'ticket.A-103', kind: 'ticket', label: 'A-103', ticket: 'A-103', title: 'Price list import', stage: 'In build', family: 'blue', rows: [
            { id: 'c-106', tag: 'build', suffix: '', status: 'working' },
            { id: 'c-107', tag: 'qa', suffix: 'waiting for sandbox', status: 'queued' },
          ] },
          { id: 'ticket.A-099', kind: 'ticket', label: 'A-099', ticket: 'A-099', title: 'Approval email template', stage: 'Done', family: 'green', rows: [
            { id: 'c-108', tag: 'build', suffix: '', status: 'done' },
            { id: 'c-109', tag: 'qa', suffix: '', status: 'done' },
          ] },
        ],
        unsorted: { id: 'unsorted', kind: 'unsorted', label: 'Unsorted', rows: [
          { id: 'c-110', title: 'Scratch notes', status: 'idle' },
        ] },
        queue: [
          { key: 'A-106', title: 'Discount floor check', stage: 'To build', family: 'blue' },
          { key: 'A-107', title: 'Contract sync retry', stage: 'UAT failed', family: 'orange' },
          { key: 'A-108', title: 'Tier export', stage: 'To build', family: 'blue' },
        ],
      };

      const FOLDER_DATA = {
        orchestrator: null,
        past: [],
        groups: [
          { id: 'folder.release-notes', kind: 'folder', label: 'release-notes-draft', rows: [
            { id: 'd-101', title: 'Draft the release notes', status: 'working' },
            { id: 'd-102', title: 'Review of the draft', status: 'working', child: true },
            { id: 'd-103', title: 'Changelog cleanup', status: 'working' },
          ] },
          { id: 'folder.packaging', kind: 'folder', label: 'packaging', rows: [
            { id: 'd-104', title: 'Packaging rebuild', status: 'done' },
          ] },
          { id: 'folder.notes', kind: 'folder', label: 'notes', rows: [
            { id: 'd-105', title: 'One-to-one prep', status: 'idle' },
          ] },
          { id: 'date.today', kind: 'date', label: 'Today', rows: [
            { id: 'd-106', title: 'Terminal research', status: 'done' },
            { id: 'd-107', title: 'Skills sync', status: 'done' },
          ] },
          { id: 'date.week', kind: 'date', label: 'Earlier this week', rows: [
            { id: 'd-108', title: 'Plan the week', status: 'done' },
            { id: 'd-109', title: 'Tidy the notes folder', status: 'done' },
            { id: 'd-110', title: 'Read the changelog', status: 'idle' },
          ] },
        ],
        unsorted: null,
        queue: [],
      };

      // Builds the host's 'fleet' message from the made-up data above.
      window.__nestHarnessFleet = function (active) {
        const data = fleetView === 'folder' ? FOLDER_DATA : TICKET_DATA;
        const orch = data.orchestrator && (!active || isLive(data.orchestrator)) ? data.orchestrator : null;
        const pastRows = active ? data.past.filter(isLive) : data.past;
        const groups = data.groups.filter((g) => !active || g.rows.some(isLive));
        const unsorted = data.unsorted && (!active || data.unsorted.rows.some(isLive)) ? data.unsorted : null;
        const top = (orch ? 1 : 0) + (pastRows.length > 0 ? 1 : 0) + groups.length + (unsorted ? 1 : 0);
        let pos = 0;
        const orchestratorRow = orch ? fleetRow(orch, 1, ++pos, top) : null;
        let past = null;
        if (pastRows.length > 0) {
          past = fleetGroup({ id: 'past-orchestrators', kind: 'user', label: 'Past orchestrators', rows: pastRows }, active, ++pos, top);
          past.forceOpen = active;
        }
        const groupMsgs = groups.map((g) => fleetGroup(g, active, ++pos, top));
        const unsortedMsg = unsorted ? fleetGroup(unsorted, active, ++pos, top) : null;
        // The Active count covers every live chat, whatever the projection.
        const liveCount =
          (data.orchestrator && isLive(data.orchestrator) ? 1 : 0) +
          data.past.filter(isLive).length +
          data.groups.reduce((n, g) => n + g.rows.filter(isLive).length, 0) +
          (data.unsorted ? data.unsorted.rows.filter(isLive).length : 0);
        return {
          type: 'fleet',
          mode: fleetView === 'folder' ? 'folders' : 'tickets',
          active: !!active,
          activeCount: liveCount,
          queueCount: data.queue.length,
          archivedCount: 3,
          orchestrator: orchestratorRow,
          pastOrchestrators: past,
          groups: groupMsgs,
          userFolders: [],
          unsorted: unsortedMsg,
          queue: data.queue.map((q, i) => ({
            position: i + 1,
            key: q.key,
            title: q.title,
            stage: q.stage,
            stageFamily: q.family,
            stageColor: null,
            live: false,
          })),
        };
      };
      if (fleetView) {
        window.postMessage(window.__nestHarnessFleet(false), '*');
      }

      // ?robin=<state> posts the host's 'robin' message for that state, and &still=1 turns
      // the animations setting off so the still pose and its marker show.
      const robinState = (/[?&]robin=([a-z]+)(&|$)/.exec(location.search) || [])[1] || null;
      if (robinState) {
        const still = /[?&]still=1(&|$)/.test(location.search);
        const markers = { error: '!', needs: '?', done: '\u2713', milestone: '\u2713', sleep: 'z', night: '\u263E' };
        const working = robinState === 'working';
        window.postMessage({
          type: 'robin',
          state: robinState,
          speed: working ? 1 : 0,
          workingCount: working ? 4 : 0,
          noteBudget: working && !still ? 4 : 0,
          noteDelaysMs: working && !still ? [200, 500, 800, 1100] : [],
          noteMinMs: 2500,
          noteSpreadMs: 3500,
          animations: !still,
          reducedHint: markers[robinState] || '',
          liveText: robinState === 'needs' ? 'A chat needs you' : robinState === 'error' ? 'A chat failed' : '',
        }, '*');
      }

      // Signal to the screenshot driver that the mock has been posted so it can wait
      // for a rendered row rather than a fixed delay.
      window.__nestHarnessReady = true;
    })();
  </script>
</body>
</html>
