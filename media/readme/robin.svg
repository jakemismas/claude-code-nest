<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 30 20" width="200" height="133" shape-rendering="crispEdges" role="img" aria-label="A pixel-art robin perched on a branch, singing">
  <style>
    .breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
    .head { transform-box: fill-box; transform-origin: 35% 100%; animation: glance 6s ease-in-out infinite; }
    .eye { fill: #1F1A17; animation: blink 3.4s steps(1, end) infinite; }
    .note { opacity: 0; animation: float 1.6s ease-out infinite; }
    .note2 { animation-delay: 0.8s; }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.025); } }
    @keyframes glance { 0%, 30% { transform: rotate(0deg); } 38%, 60% { transform: rotate(-12deg); } 68%, 100% { transform: rotate(0deg); } }
    @keyframes blink { 0%, 94.99% { fill: #1F1A17; } 95%, 100% { fill: #5B4A42; } }
    @keyframes float { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-6px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none } }
  </style>
  <g class="breathe">
    <g class="body">
      <rect x="5" y="4" width="3" height="1" fill="#5B4A42"/>
      <rect x="12" y="4" width="2" height="1" fill="#5B4A42"/>
      <rect x="8" y="4" width="4" height="1" fill="#8A7469"/>
      <rect x="14" y="4" width="5" height="1" fill="#D9692E"/>
      <rect x="2" y="5" width="6" height="1" fill="#5B4A42"/>
      <rect x="12" y="5" width="2" height="1" fill="#5B4A42"/>
      <rect x="8" y="5" width="4" height="1" fill="#8A7469"/>
      <rect x="14" y="5" width="5" height="1" fill="#D9692E"/>
      <rect x="0" y="6" width="8" height="1" fill="#5B4A42"/>
      <rect x="12" y="6" width="2" height="1" fill="#5B4A42"/>
      <rect x="8" y="6" width="4" height="1" fill="#8A7469"/>
      <rect x="14" y="6" width="5" height="1" fill="#D9692E"/>
      <rect x="6" y="7" width="2" height="1" fill="#5B4A42"/>
      <rect x="12" y="7" width="2" height="1" fill="#5B4A42"/>
      <rect x="8" y="7" width="4" height="1" fill="#8A7469"/>
      <rect x="14" y="7" width="4" height="1" fill="#D9692E"/>
      <rect x="8" y="8" width="6" height="1" fill="#5B4A42"/>
      <rect x="14" y="8" width="3" height="1" fill="#D9692E"/>
      <rect x="11" y="9" width="1" height="1" fill="#5B4A42"/>
      <rect x="15" y="9" width="1" height="1" fill="#D9692E"/>
    </g>
    <g class="head">
      <rect x="14" y="0" width="4" height="1" fill="#5B4A42"/>
      <rect x="12" y="1" width="7" height="1" fill="#5B4A42"/>
      <rect x="11" y="2" width="4" height="1" fill="#5B4A42"/>
      <rect x="16" y="2" width="4" height="1" fill="#5B4A42"/>
      <rect x="20" y="2" width="2" height="1" fill="#C99413"/>
      <rect x="15" y="2" width="1" height="1" class="eye"/>
      <rect x="10" y="3" width="10" height="1" fill="#5B4A42"/>
      <rect x="20" y="3" width="1" height="1" fill="#C99413"/>
    </g>
  </g>
  <g class="branch">
    <rect x="20" y="10" width="1" height="1" fill="#4E9A5B"/>
    <rect x="6" y="10" width="14" height="1" fill="#8A5A3B"/>
  </g>
  <g transform="translate(25 -1)"><g class="note"><rect x="1" y="0" width="1" height="4" fill="#D9692E"/><rect x="0" y="3" width="1" height="1" fill="#D9692E"/><rect x="0" y="4" width="2" height="1" fill="#D9692E"/><rect x="2" y="0" width="2" height="1" fill="#D9692E"/></g></g>
  <g transform="translate(27 -3)"><g class="note note2"><rect x="1" y="0" width="1" height="4" fill="#8A7469"/><rect x="0" y="3" width="1" height="1" fill="#8A7469"/><rect x="0" y="4" width="2" height="1" fill="#8A7469"/><rect x="2" y="0" width="2" height="1" fill="#8A7469"/></g></g>
</svg>
